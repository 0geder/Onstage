services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: onstage-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: onstage
      POSTGRES_PASSWORD: onstage
      POSTGRES_DB: onstage
    ports:
      - '5432:5432'
    volumes:
      - onstage-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U onstage -d onstage']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: onstage-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - onstage-redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: onstage-minio
    restart: unless-stopped
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: onstage
      MINIO_ROOT_PASSWORD: onstage123
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - onstage-miniodata:/data

volumes:
  onstage-pgdata:
  onstage-redisdata:
  onstage-miniodata:
