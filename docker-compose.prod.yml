# ─────────────────────────────────────────────────────────────────────────────
# Onstage — production stack for a single Linux server.
#
#   ./scripts/deploy.sh            # the normal way: build, migrate, start, report
#
# or by hand:
#
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#
# Every setting comes from .env.production next to this file (copy it from
# .env.production.example; it is never committed). Caddy is the only service
# with public ports; Postgres, Redis and the apps are reachable only on the
# private compose network.
#
# Each service lists the variables it reads explicitly, so a service only ever
# sees its own secrets (the public website never holds the admin token). A new
# variable in the code therefore needs a line here as well as in the example.
#
# Defaults below mirror the code's own defaults. They are spelled out because
# an empty variable is not the same as an unset one: `Number('')` is 0 and an
# empty cron pattern is invalid.
# ─────────────────────────────────────────────────────────────────────────────

name: ${COMPOSE_PROJECT_NAME:-onstage}

x-logging: &logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '5'

x-database-url: &database-url postgresql://${POSTGRES_USER:-onstage}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.production}@postgres:5432/${POSTGRES_DB:-onstage}?schema=public

x-firebase-env: &firebase-env
  FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:?set FIREBASE_PROJECT_ID in .env.production}
  FIREBASE_CLIENT_EMAIL: ${FIREBASE_CLIENT_EMAIL:?set FIREBASE_CLIENT_EMAIL in .env.production}
  FIREBASE_PRIVATE_KEY: ${FIREBASE_PRIVATE_KEY:?set FIREBASE_PRIVATE_KEY in .env.production}

# Sign in with Apple server credentials (token revocation on account
# deletion). Optional: all empty switches it off.
x-apple-env: &apple-env
  APPLE_TEAM_ID: ${APPLE_TEAM_ID:-}
  APPLE_KEY_ID: ${APPLE_KEY_ID:-}
  APPLE_PRIVATE_KEY: ${APPLE_PRIVATE_KEY:-}
  APPLE_CLIENT_ID: ${APPLE_CLIENT_ID:-za.co.onstage}

x-sentry-server-env: &sentry-server-env
  SENTRY_DSN: ${SENTRY_DSN:-}
  SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
  SENTRY_RELEASE: ${SENTRY_RELEASE:-onstage@${IMAGE_TAG:-latest}}
  SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.1}

# Build-time values for the Next.js apps. Next inlines a NEXT_PUBLIC_* value
# only if it exists during `npm run build`; otherwise server code reads it at
# runtime (the environment blocks below) and browser code sees nothing. The
# Dockerfile's web-build/admin-build stages declare matching ARGs. Only values
# that are never empty, or whose readers treat empty as unset (the DSN), belong
# here, since an empty string would defeat the apps' `??` defaults.
x-next-build-args: &next-build-args
  NEXT_PUBLIC_WEB_BASE_URL: https://${WEB_DOMAIN:?set WEB_DOMAIN in .env.production}
  NEXT_PUBLIC_SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
  NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}

services:
  # ── Datastores (private) ──────────────────────────────────────────────────
  postgres:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-onstage}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.production}
      POSTGRES_DB: ${POSTGRES_DB:-onstage}
    volumes:
      - pgdata:/var/lib/postgresql/data
    shm_size: 256mb
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    stop_grace_period: 60s
    logging: *logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env.production}
      - --appendonly
      - 'yes'
    environment:
      # redis-cli reads this, so the healthcheck never puts the password on a command line.
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *logging

  # ── One-shot: apply pending Prisma migrations, then exit ──────────────────
  migrate:
    image: ${IMAGE_REGISTRY:-onstage}/migrate:${IMAGE_TAG:-latest}
    build:
      context: .
      target: migrate
    restart: 'no'
    environment:
      DATABASE_URL: *database-url
    depends_on:
      postgres:
        condition: service_healthy
    logging: *logging

  # ── API ───────────────────────────────────────────────────────────────────
  api:
    image: ${IMAGE_REGISTRY:-onstage}/api:${IMAGE_TAG:-latest}
    build:
      context: .
      target: api
    restart: unless-stopped
    environment:
      <<: [*firebase-env, *sentry-server-env, *apple-env]
      NODE_ENV: production
      API_PORT: '3000'
      API_BASE_URL: https://${API_DOMAIN:?set API_DOMAIN in .env.production}
      WEB_BASE_URL: https://${WEB_DOMAIN:?set WEB_DOMAIN in .env.production}
      # Browser origins allowed to call the API. The mobile app and the
      # server-rendered web/admin apps do not need an entry.
      CORS_ORIGINS: ${CORS_ORIGINS:-https://${WEB_DOMAIN}}
      # Exactly one proxy (Caddy) sits in front, so req.ip is the real client.
      TRUST_PROXY: ${TRUST_PROXY:-1}
      ENABLE_API_DOCS: ${ENABLE_API_DOCS:-false}
      DATABASE_URL: *database-url
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      # Dev tokens are refused in production anyway; pin it so a typo cannot matter.
      AUTH_MODE: firebase
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:?set ADMIN_API_TOKEN in .env.production}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      CDN_BASE_URL: ${CDN_BASE_URL:-}
      AFFILIATE_ID: ${AFFILIATE_ID:-}
      AFFILIATE_PARAMS: ${AFFILIATE_PARAMS:-}
      PRIVACY_POLICY_VERSION: ${PRIVACY_POLICY_VERSION:-2026-01-01}
      HOWLER_WEBHOOK_TOKEN: ${HOWLER_WEBHOOK_TOKEN:-}
      HOWLER_ORGANISER_IDS: ${HOWLER_ORGANISER_IDS:-}
      UBER_CLIENT_ID: ${UBER_CLIENT_ID:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # Healthy only when the database answers; Redis down is "degraded" but still serving.
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/v1/health').then(r=>r.json()).then(j=>process.exit(j.database==='up'?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    stop_grace_period: 20s
    logging: *logging

  # ── Worker: ingestion, notifications, account deletion (cron, no HTTP) ───
  # Run exactly one. It has no port, so there is no healthcheck; Docker
  # restarts it if the process exits.
  worker:
    image: ${IMAGE_REGISTRY:-onstage}/worker:${IMAGE_TAG:-latest}
    build:
      context: .
      target: worker
    restart: unless-stopped
    environment:
      <<: [*firebase-env, *sentry-server-env, *apple-env]
      NODE_ENV: production
      DATABASE_URL: *database-url
      LOG_LEVEL: ${LOG_LEVEL:-info}
      WORKER_TIMEZONE: ${WORKER_TIMEZONE:-Africa/Johannesburg}
      INGESTION_ENABLED: ${INGESTION_ENABLED:-true}
      INGESTION_HOT_CRON: ${INGESTION_HOT_CRON:-0 * * * *}
      INGESTION_COLD_CRON: ${INGESTION_COLD_CRON:-0 4 * * *}
      NOTIFICATIONS_CRON: ${NOTIFICATIONS_CRON:-*/5 * * * *}
      INGESTION_MARKETS: ${INGESTION_MARKETS:-ZA}
      INGESTION_RATE_LIMIT: ${INGESTION_RATE_LIMIT:-4}
      INGESTION_TIMEOUT_MS: ${INGESTION_TIMEOUT_MS:-15000}
      DEDUPE_RADIUS_METRES: ${DEDUPE_RADIUS_METRES:-500}
      DEDUPE_WINDOW_HOURS: ${DEDUPE_WINDOW_HOURS:-24}
      JOB_MAX_RUNTIME_MS: ${JOB_MAX_RUNTIME_MS:-7200000}
      WORKER_SHUTDOWN_TIMEOUT_MS: ${WORKER_SHUTDOWN_TIMEOUT_MS:-25000}
      ACCOUNT_DELETION_CRON: ${ACCOUNT_DELETION_CRON:-30 3 * * *}
      DELETION_GRACE_DAYS: ${DELETION_GRACE_DAYS:-7}
      PUSH_DELIVERY: ${PUSH_DELIVERY:-expo}
      EXPO_ACCESS_TOKEN: ${EXPO_ACCESS_TOKEN:-}
      BANDSINTOWN_APP_ID: ${BANDSINTOWN_APP_ID:-}
      BANDSINTOWN_BASE_URL: ${BANDSINTOWN_BASE_URL:-https://rest.bandsintown.com}
      SONGKICK_API_KEY: ${SONGKICK_API_KEY:-}
      SONGKICK_BASE_URL: ${SONGKICK_BASE_URL:-https://api.songkick.com/api/3.0}
      TICKETMASTER_API_KEY: ${TICKETMASTER_API_KEY:-}
      TICKETMASTER_BASE_URL: ${TICKETMASTER_BASE_URL:-https://app.ticketmaster.com/discovery/v2}
      QUICKET_API_KEY: ${QUICKET_API_KEY:-}
      QUICKET_BASE_URL: ${QUICKET_BASE_URL:-https://api.quicket.co.za/api}
      HOWLER_WEBHOOK_TOKEN: ${HOWLER_WEBHOOK_TOKEN:-}
      MUSICBRAINZ_BASE_URL: ${MUSICBRAINZ_BASE_URL:-https://musicbrainz.org/ws/2}
      MUSICBRAINZ_CONTACT: ${MUSICBRAINZ_CONTACT:-https://${WEB_DOMAIN}}
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    # The worker waits up to WORKER_SHUTDOWN_TIMEOUT_MS for running jobs.
    stop_grace_period: 35s
    logging: *logging

  # ── Public website (also serves /.well-known app-link files, /privacy, /terms)
  web:
    image: ${IMAGE_REGISTRY:-onstage}/web:${IMAGE_TAG:-latest}
    build:
      context: .
      target: web
      args: *next-build-args
    restart: unless-stopped
    environment:
      <<: *sentry-server-env
      NODE_ENV: production
      # Server-side fetches stay on the private network.
      API_BASE_URL: http://api:3000
      NEXT_PUBLIC_WEB_BASE_URL: https://${WEB_DOMAIN}
      # '#' is the app's own fallback while the store listings do not exist.
      NEXT_PUBLIC_APP_STORE_URL: ${NEXT_PUBLIC_APP_STORE_URL:-#}
      NEXT_PUBLIC_PLAY_STORE_URL: ${NEXT_PUBLIC_PLAY_STORE_URL:-#}
      ANDROID_CERT_SHA256: ${ANDROID_CERT_SHA256:-}
      ANDROID_PACKAGE: ${ANDROID_PACKAGE:-za.co.onstage}
      APPLE_TEAM_ID: ${APPLE_TEAM_ID:-}
      IOS_BUNDLE_ID: ${IOS_BUNDLE_ID:-za.co.onstage}
    depends_on:
      api:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/',{redirect:'manual'}).then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging: *logging

  # ── Admin CMS ─────────────────────────────────────────────────────────────
  admin:
    image: ${IMAGE_REGISTRY:-onstage}/admin:${IMAGE_TAG:-latest}
    build:
      context: .
      target: admin
      args: *next-build-args
    restart: unless-stopped
    environment:
      <<: *sentry-server-env
      NODE_ENV: production
      API_BASE_URL: http://api:3000
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:?set ADMIN_API_TOKEN in .env.production}
      ADMIN_USERS: ${ADMIN_USERS:?set ADMIN_USERS in .env.production}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:?set ADMIN_SESSION_SECRET in .env.production}
    depends_on:
      api:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/login',{redirect:'manual'}).then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging: *logging

  # ── Caddy: the only public service. HTTPS certificates are automatic. ────
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
      - '${HTTPS_PORT:-443}:443/udp'
    environment:
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN in .env.production}
      WEB_DOMAIN: ${WEB_DOMAIN:?set WEB_DOMAIN in .env.production}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:?set ADMIN_DOMAIN in .env.production}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env.production}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - web
      - admin
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:2019/config/']
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *logging

volumes:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config:
